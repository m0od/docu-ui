name: production-from-dev

# production only takes pull requests from dev. The repository ruleset makes this check required,
# so a PR from any other branch cannot be merged into production.
on:
  pull_request:
    branches: [production]

permissions: {}

jobs:
  from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "dev" ]; then
            echo "::error::Pull requests into production must come from dev, not '$SOURCE_BRANCH'."
            exit 1
          fi
