name: archive-merged-branch

# After a pull request is merged, keep its branch as a tag and delete the branch.
# Squash merges collapse the branch into one commit; the tag keeps the original commits reachable.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  archive:
    # dev and production are long-lived (dev is the source of every production PR); forks are not ours to touch.
    if: >-
      github.event.pull_request.merged &&
      github.head_ref != 'dev' &&
      github.head_ref != 'production' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Tag the branch head as archive/<branch>
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          archiveTag="archive/$BRANCH_NAME"
          # A branch name reused after an earlier merge already has a tag; keep both by adding the PR number.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$archiveTag" >/dev/null 2>&1; then
            archiveTag="$archiveTag-pr$PR_NUMBER"
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$archiveTag" -f sha="$HEAD_SHA" >/dev/null
          echo "Archived $BRANCH_NAME at $HEAD_SHA as $archiveTag"
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH_NAME"
